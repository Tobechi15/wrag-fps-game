<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- WRAG mark - a dark angular badge (top-right corner cut, matching the
       site's recurring clip-path corner-cut panel motif) with orange corner
       brackets on the two uncut corners and a centered crosshair/reticle,
       echoing the in-game HUD's own #crosshair. Hand-authored to exactly
       match site/public/icon-*.png (see the Node script that generated
       those - no vector/image tool was available, so both were built from
       the same plain geometry by hand). -->
  <path d="M0,0 L84,0 L100,16 L100,100 L0,100 Z" fill="#0a0b0d" />
  <rect x="0" y="0" width="4.5" height="20" fill="#ff6a3d" />
  <rect x="0" y="0" width="20" height="4.5" fill="#ff6a3d" />
  <rect x="95.5" y="80" width="4.5" height="20" fill="#ff6a3d" />
  <rect x="80" y="95.5" width="20" height="4.5" fill="#ff6a3d" />
  <circle cx="50" cy="50" r="23" fill="none" stroke="#ff6a3d" stroke-width="6" />
  <rect x="46.5" y="10" width="7" height="12" fill="#ff6a3d" />
  <rect x="46.5" y="78" width="7" height="12" fill="#ff6a3d" />
  <rect x="10" y="46.5" width="12" height="7" fill="#ff6a3d" />
  <rect x="78" y="46.5" width="12" height="7" fill="#ff6a3d" />
</svg>
