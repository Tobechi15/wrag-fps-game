<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WRAG — Sign Up</title>
  <meta name="description" content="Create a WRAG account and deploy into your first match." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0b0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/theme.css" />
  <link rel="stylesheet" href="/src/nav.css" />
  <link rel="stylesheet" href="/src/auth.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="wordmark" href="/">WRAG</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-glow" aria-hidden="true"></div>
    <div class="auth-card panel">
      <h1 class="auth-title">Sign Up</h1>
      <form class="auth-form" id="signup-form">
        <label class="auth-field">
          <span class="label">Callsign</span>
          <input type="text" name="callsign" required minlength="3" maxlength="20" autocomplete="nickname" />
        </label>
        <label class="auth-field">
          <span class="label">Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label class="auth-field">
          <span class="label">Password</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
        </label>
        <div class="auth-error" id="auth-error" hidden></div>
        <button class="btn btn-primary auth-submit" type="submit">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>

  <script type="module" src="/src/signup.js"></script>
</body>
</html>
